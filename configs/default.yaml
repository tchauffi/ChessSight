# Baseline configuration for a full synthetic training set.
#
# Engine notes:
#   BLENDER_EEVEE  ~0.2 s/image  - use this while iterating.
#   CYCLES         ~1-3 s/image  - use this for the final dataset; it needs OPTIX,
#                                  and no more than 2 workers since they share one GPU.
count: 50000
master_seed: 20260729

render:
  engine: CYCLES
  samples: 96
  resolution: [512, 512]
  use_gpu: true
  compute_device_type: OPTIX
  denoise: true
  image_format: JPEG
  jpeg_quality: 92
  render_id_pass: true

camera:
  # Elevation reaches down to 8 degrees so the set includes the grazing, near
  # edge-on angles that hand-held phone photographs and broadcast cameras across a
  # table actually give -- the views the detector was weakest on. Labels stay exact
  # that low; see CameraConfig.elevation_deg for the measurements.
  azimuth_deg: {min: 0.0, max: 360.0}
  elevation_deg: {min: 8.0, max: 75.0}
  # A safety guard only, not a framing control: distance is derived from the lens and
  # the pose. Kept wide on purpose -- narrowed to 11-20 it overrode the derived value
  # on 70% of samples and cropped the board instead of framing it.
  distance: {min: 6.0, max: 40.0}
  roll_deg: {min: -6.0, max: 6.0}
  focal_mm: {min: 24.0, max: 85.0}
  sensor_width_mm: 36.0
  target_jitter: {min: -1.2, max: 1.2}
  dof_probability: 0.35
  f_stop: {min: 1.8, max: 11.0}

lighting:
  # A directory of .hdr/.exr files (fetch with `chesssight assets hdri`). Every
  # scene is lit by -- and backed by -- one of the maps: a real room behind the
  # table is the single biggest realism win over a flat-colour void. If the
  # directory is missing the generator falls back to the procedural sun rig, so
  # the pipeline still works with no external assets.
  hdri_dir: ~/assets/chesssight/hdri
  hdri_probability: 1.0
  # An HDRI is the *only* light when one is used: the procedural sun and fills are
  # suppressed, since adding them on top triple-lights the scene and erases the
  # lighting character the map was chosen for. It also gets its own, much narrower
  # strength range, because an environment map already encodes absolute radiance.
  hdri_strength: {min: 0.5, max: 1.6}
  world_strength: {min: 0.3, max: 2.5}
  world_color_temperature: {min: 3200.0, max: 7500.0}
  sun_energy: {min: 1.0, max: 6.0}
  sun_angle_deg: {min: 0.5, max: 8.0}
  sun_elevation_deg: {min: 25.0, max: 85.0}
  lamp_count: {min: 0, max: 2}
  lamp_energy: {min: 1500.0, max: 12000.0}

pieces:
  # Two sets, drawn per scene. Real boards differ in silhouette far more than in
  # size, and a dataset rendered from a single set lets the detector key on that
  # set's outline -- a cue that does not survive contact with a photo of someone
  # else's board. The baked Staunton OBJ set (see `chesssight assets bake`) has no
  # silent fallback: a missing manifest is an error, so drop that entry on a
  # machine without the baked assets and the procedural one still works alone.
  sets:
    - {provider: uppachess-staunton, asset_manifest: assets/baked/manifest.json, weight: 0.6}
    - {provider: procedural, weight: 0.4}
  height_scale: {min: 0.85, max: 1.15}
  radius_scale: {min: 0.85, max: 1.15}
  # Shape variation *within* the procedural set: positive widens the base and
  # narrows the top, so it spans squat through slender rather than one fixed
  # outline. Bounded jointly with radius_scale so a flared base cannot overflow
  # its square -- the config rejects a combination that would.
  taper: {min: -0.12, max: 0.12}
  lathe_segments: {min: 16, max: 48}
  position_jitter: {min: -0.16, max: 0.16}
  tipped_probability: 0.02

scene:
  # A finite slab with a visible edge, so the HDRI room shows beyond the table
  # instead of the table running to the horizon.
  table_thickness: {min: 0.4, max: 1.0}
  distractor_probability: 0.3
  distractor_count: {min: 0, max: 3}

positions:
  # A Lichess dump (fetch any month from https://database.lichess.org; the 2013
  # ones are ~17 MB and hold ~120k games, which is plenty). Random boards stay a
  # third of the mix on purpose: real games are dominated by near-starting
  # positions, and a purely game-derived set lets the model lean on chess priors
  # instead of reading pixels. Measured over 5000 draws, the mixture puts 23% of
  # pieces on pawns against a random sampler's 15% -- real games are mostly pawns,
  # and pawns are the classes the detector scores worst on.
  pgn_paths:
    - ~/assets/chesssight/pgn/lichess_db_standard_rated_2013-01.pgn.zst
  max_games: 40000
  plies_per_game: 3
  skip_opening_plies: 6
  weight_pgn: 0.7
  weight_random: 0.3

output:
  root: ~/datasets/chesssight
  run_name: v1
  split: train
