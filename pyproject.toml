[project]
name = "chesssight"
version = "0.1.0"
description = "Computer vision tool for chess analysis and piece detection"
authors = [
    {name = "Thibaut CHAUFFIER",email = "tchauffi@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.12,<4.0"
dependencies = [
    "numpy>=2.0,<3.0",
    "pillow>=11.0,<13.0",
    "chess>=1.11,<2.0",
    "typer>=0.15,<1.0",
    "pydantic>=2.9,<3.0",
    "pyyaml>=6.0,<7.0",
    "zstandard>=0.23,<1.0",
]

[project.optional-dependencies]
# Training is opt-in: torch alone is ~3 GB, and the generator is useful without it.
#   uv sync --extra train
train = [
    "torch>=2.9,<3.0",
    "torchvision>=0.24,<1.0",
    "transformers>=4.46,<5.0",
    "timm>=1.0,<2.0",
    "accelerate>=1.0,<2.0",
    "torchmetrics>=1.5,<2.0",
    "pycocotools>=2.0.8,<3.0",
    # The RT-DETR Hungarian matcher needs scipy.optimize.linear_sum_assignment.
    "scipy>=1.14,<2.0",
]

# Running the exported graphs needs neither torch nor transformers.
#   uv sync --extra onnx
onnx = [
    "onnxruntime>=1.20,<2.0",
]

# Writing the graphs additionally needs the exporter and a training install.
#   uv sync --extra train --extra onnx --extra onnx-export
onnx-export = [
    "onnx>=1.17,<2.0",
    # fp16 weight conversion for the checked-in bundle (--fp16).
    "onnxconverter-common>=1.14,<2.0",
]

# The RTX 50-series is Blackwell (sm_120); the default PyPI wheels do not carry
# kernels for it, so torch and torchvision come from the CUDA 12.8 index.
[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }

[project.scripts]
chesssight = "chesssight.cli:app"

[dependency-groups]
dev = [
    "pre-commit>=4.2.0,<5.0.0",
    "ruff>=0.11.10,<0.12.0",
    "mypy>=1.15.0,<2.0.0",
    "black>=25.1.0,<26.0.0",
    "pytest>=8.3.0,<9.0.0",
    "types-PyYAML>=6.0,<7.0",
]

[tool.ruff]
line-length = 88  # Match black's default line length
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "C",  # flake8-comprehensions
    "B",  # flake8-bugbear
]
ignore = []

[tool.mypy]
python_version = "3.12"
# The `chesssight.blender` package runs inside Blender's own bundled Python and
# imports `bpy`, which does not exist in this venv or in CI.
exclude = ["^src/chesssight/blender/"]

[[tool.mypy.overrides]]
module = ["chesssight.blender.*"]
ignore_missing_imports = true

# Training is an opt-in extra, so CI type-checks without torch installed at all
# and every `import torch` is an unresolved module there. Locally, where the
# extra *is* installed, torch ships py.typed and is checked normally -- this
# only stops CI failing on an absence it was configured to have. torchvision and
# the rest additionally ship no py.typed marker, so they stay untyped either way.
[[tool.mypy.overrides]]
module = ["onnxruntime.*", "onnx.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
    "torch.*",
    "timm.*",
    "torchvision.*",
    "transformers.*",
    "torchmetrics.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "blender: integration tests that require a `blender` executable on PATH",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chesssight"]
